<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Access — The AI Readyist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg-surface: #f9f9f7; --border: #e2e2dc; --border-dark: #c8c8c0;
      --text: #111111; --text-mid: #555555; --text-muted: #999990;
      --red: #c0392b; --red-bg: rgba(192,57,43,0.06);
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    html, body { height: 100%; background: var(--bg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .wrap { width: 100%; max-width: 360px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-name { font-family: Georgia, serif; font-size: 22px; font-weight: 400; font-style: italic; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; }
    .brand-tag  { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); padding: 32px; }
    .card-title { font-family: Georgia, serif; font-size: 18px; font-weight: 400; font-style: italic; color: var(--text); margin-bottom: 6px; }
    .card-sub   { font-size: 13px; color: var(--text-mid); font-weight: 300; margin-bottom: 28px; line-height: 1.5; }
    .label { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
    .input { width: 100%; background: var(--bg); border: 1px solid var(--border-dark); color: var(--text); font-family: var(--font-mono); font-size: 14px; padding: 10px 12px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; appearance: none; border-radius: 0; letter-spacing: 0.04em; }
    .input:focus { border-color: var(--text); box-shadow: 0 0 0 2px rgba(17,17,17,0.07); }
    .field { margin-bottom: 20px; }
    .btn { width: 100%; background: var(--text); color: #fff; border: none; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 13px 20px; cursor: pointer; transition: background 0.15s; border-radius: 0; }
    .btn:hover { background: #333; }
    .error { display: none; background: var(--red-bg); border: 1px solid rgba(192,57,43,0.2); color: var(--red); font-family: var(--font-mono); font-size: 11px; padding: 10px 12px; margin-top: 14px; letter-spacing: 0.03em; }
    .error.show { display: block; }
    .note { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 12px; letter-spacing: 0.04em; }
    .lock { display: none; background: var(--red-bg); border: 1px solid rgba(192,57,43,0.2); color: var(--red); font-family: var(--font-mono); font-size: 11px; padding: 16px; text-align: center; letter-spacing: 0.03em; line-height: 1.7; }
    .lock.show { display: block; }
    .footer { text-align: center; margin-top: 28px; }
    .footer a { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-decoration: none; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); padding-bottom: 1px; }
    .footer a:hover { color: var(--text); border-color: var(--text); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .shake { animation: shake 0.35s ease; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="brand">
      <div class="brand-name">theAIReadyist</div>
      <div class="brand-tag">Admin access</div>
    </div>

    <div class="card" id="login-card">
      <div class="lock" id="lock-msg">Access locked for 15 minutes.<br>Too many failed attempts.</div>
      <div id="login-form-wrap">
        <div class="card-title">Sign in</div>
        <p class="card-sub">Restricted area. Enter the admin password to continue.</p>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="••••••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') attemptLogin()" />
        </div>
        <button class="btn" onclick="attemptLogin()">Access admin</button>
        <div class="error" id="error-msg">Incorrect password. Please try again.</div>
        <div class="note"  id="attempts-note"></div>
      </div>
    </div>

    <div class="footer"><a href="https://theaireadyist.com">← Back to site</a></div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Already logged in? Skip to dashboard
    if (sessionStorage.getItem('aireadyist_admin_auth') === 'true') {
      window.location.replace('./index.html');
    }
    // Check lockout on load
    checkLockout();
  </script>
</body>
</html>
