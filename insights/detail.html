<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight — The AI Readyist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0D1B2A;--teal:#00C9A7;--amber:#E8A838;--off-white:#F5F2EC;--slate:#6B7A8D;--rule:rgba(107,122,141,0.20)}
body{background:var(--navy);color:var(--off-white);font-family:'DM Sans',sans-serif;min-height:100vh}
header{border-bottom:1px solid var(--rule);padding:1.25rem 2rem;display:flex;gap:1.5rem;align-items:center}
.back{color:var(--off-white);text-decoration:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.back:hover{opacity:1}
main{max-width:720px;margin:0 auto;padding:3rem 2rem}
.meta{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
.date{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.08em}
.tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);border:1px solid var(--rule);border-radius:2px;padding:2px 6px}
h1{font-family:'Playfair Display',serif;font-size:clamp(1.75rem,4vw,2.5rem);font-weight:600;line-height:1.2;margin-bottom:1.5rem}
.summary{font-size:1.05rem;color:rgba(245,242,236,.8);line-height:1.7;margin-bottom:2rem;border-left:2px solid var(--teal);padding-left:1rem}
.body{font-size:.95rem;line-height:1.8;color:rgba(245,242,236,.75)}
.body p{margin-bottom:1rem}
.body h2{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:600;margin:2rem 0 .75rem}
.body h3{font-family:'DM Mono',monospace;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:1.5rem 0 .5rem}
.body ul,.body ol{padding-left:1.5rem;margin-bottom:1rem}
.body li{margin-bottom:.4rem}
#status{color:var(--slate);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;padding:3rem 0}
.not-found{text-align:center}
</style>
</head>
<body>
<header>
  <a class="back" href="/insights">&#8592; All insights</a>
  <a class="back" href="/">The AI Readyist</a>
</header>
<main id="main">
  <div id="status">Loading&#8230;</div>
</main>
<script>
(function(){
  const SUPABASE_URL='https://mydxofjvpuurwwaohqys.supabase.co';
  const SUPABASE_KEY='sb_publishable_gAIR6BSI1ZwMNSzafJCAdQ_hAb6jtAR';
  // Get slug from URL path: /insights/some-slug
  const slug = window.location.pathname.replace(/^\/insights\//, '').replace(/\/$/, '');
  if (!slug) { window.location.replace('/insights'); return; }
  // Update page title while loading
  document.title = 'Loading… — The AI Readyist';
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function renderMarkdown(md){
    // Simple markdown: headings, bold, paragraphs
    return md
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^# (.+)$/gm,'<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
      .split(/\n\n+/).map(p=>p.startsWith('<h')||p.startsWith('<ul')?p:'<p>'+p+'</p>').join('\n');
  }
  const url=SUPABASE_URL+'/rest/v1/insights?select=id,slug,title,summary,body,sectors,regions,published_at&status=eq.published&slug=eq.'+encodeURIComponent(slug)+'&limit=1';
  fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(rows=>{
    const row = rows && rows[0];
    if (!row) {
      document.getElementById('status').innerHTML='<div class="not-found"><p style="margin-bottom:1rem">Insight not found.</p><a class="back" href="/insights" style="opacity:1">&#8592; Back to all insights</a></div>';
      return;
    }
    document.title = (row.title||'Insight') + ' — The AI Readyist';
    const date = row.published_at ? new Date(row.published_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '';
    const tags = [].concat(row.sectors||[],row.regions||[]).slice(0,4).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    const bodyHtml = row.body ? '<div class="body">'+renderMarkdown(row.body)+'</div>' : '';
    document.getElementById('main').innerHTML =
      '<div class="meta"><span class="date">'+esc(date)+'</span>'+tags+'</div>'
      +'<h1>'+esc(row.title||'')+'</h1>'
      +(row.summary?'<div class="summary">'+esc(row.summary)+'</div>':'')
      +bodyHtml;
  })
  .catch(err=>{document.getElementById('status').textContent='Could not load insight.';console.warn(err)});
})();
</script>
</body>
</html>
