<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insights — The AI Readyist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0D1B2A;--teal:#00C9A7;--amber:#E8A838;--off-white:#F5F2EC;--slate:#6B7A8D;--rule:rgba(107,122,141,0.20)}
body{background:var(--navy);color:var(--off-white);font-family:'DM Sans',sans-serif;min-height:100vh}
header{border-bottom:1px solid var(--rule);padding:1.25rem 2rem}
.back{color:var(--off-white);text-decoration:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.back:hover{opacity:1}
main{max-width:880px;margin:0 auto;padding:3rem 2rem}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,2.75rem);font-weight:600;margin-bottom:.4rem}
.sub{color:var(--slate);font-size:.85rem;font-family:'DM Mono',monospace;letter-spacing:.06em;margin-bottom:2.5rem}
.card{display:block;background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:3px;padding:1.5rem;text-decoration:none;color:var(--off-white);transition:border-color .2s,background .2s;margin-bottom:1rem}
.card:hover{border-color:rgba(0,201,167,.4);background:rgba(0,201,167,.05)}
.meta{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
.date{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.08em}
.tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);border:1px solid var(--rule);border-radius:2px;padding:2px 6px}
.title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:600;margin-bottom:.4rem;line-height:1.3}
.summary{font-size:.85rem;color:rgba(245,242,236,.65);line-height:1.6;margin-bottom:.75rem}
.cta{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
#status{color:var(--slate);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;margin-bottom:1.5rem}
</style>
</head>
<body>
<header><a class="back" href="/">&#8592; The AI Readyist</a></header>
<main>
  <h1>Insights</h1>
  <p class="sub">Agent-produced research, reviewed before publication</p>
  <div id="status">Loading&#8230;</div>
  <div id="grid"></div>
</main>
<script>
(function(){
  const SUPABASE_URL='https://mydxofjvpuurwwaohqys.supabase.co';
  const SUPABASE_KEY='sb_publishable_gAIR6BSI1ZwMNSzafJCAdQ_hAb6jtAR';
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  const url=SUPABASE_URL+'/rest/v1/insights?select=id,slug,title,summary,sectors,regions,published_at&status=eq.published&order=published_at.desc&limit=100';
  fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(rows=>{
    if(!Array.isArray(rows)||!rows.length){document.getElementById('status').textContent='No published insights yet.';return}
    const seen=new Set();
    const unique=rows.filter(row=>{const k=(row.title||row.slug||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();if(!k||seen.has(k))return false;seen.add(k);return true;});
    document.getElementById('status').textContent=unique.length+' insight'+(unique.length===1?'':'s');
    document.getElementById('grid').innerHTML=unique.map(row=>{
      const date=row.published_at?new Date(row.published_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
      const tags=[].concat(row.sectors||[],row.regions||[]).slice(0,3).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
      const href=row.slug?'/insights/'+row.slug:'/insights';
      return '<a class="card" href="'+href+'">'
        +'<div class="meta"><span class="date">'+esc(date)+'</span>'+tags+'</div>'
        +'<div class="title">'+esc(row.title||'')+'</div>'
        +'<div class="summary">'+esc((row.summary||'').slice(0,200))+(row.summary&&row.summary.length>200?'&#8230;':'')+'</div>'
        +'<span class="cta">Read insight &#8594;</span></a>';
    }).join('');
  })
  .catch(err=>{document.getElementById('status').textContent='Could not load insights.';console.warn(err)});
})();
</script>
</body>
</html>
