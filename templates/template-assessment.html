<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Template — theAIReadyist</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/typography.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/brand.css" />
  <link rel="stylesheet" href="/styles/templates.css" />
</head>
<body class="tmpl tmpl-assessment">
  <main class="layout section">
    <header class="masthead mb-5">
      <span class="masthead__brand wordmark">the<span class="wordmark__ai">AI</span>Readyist</span>
      <span class="masthead__product">EU AI Act Navigator</span>
      <span class="masthead__context">Exposure Assessment</span>
    </header>

    <div class="tmpl-assessment__layout">
      <!-- sticky results — utility panel (raised allowed) -->
      <aside class="tmpl-assessment__results">
        <p class="t-label">Running score</p>
        <p class="t-data-lg mt-3">47<span class="t-data" style="color:var(--color-text-muted)">/100</span></p>
        <p class="mt-3"><span class="badge badge--warning">Partial exposure</span></p>
        <p class="t-meta mt-3">Domain 2 of 6</p>
      </aside>

      <!-- domain blocks -->
      <section>
        <div class="tmpl-assessment__domain" style="border-top:none;">
          <p class="t-label">Domain · weight 20%</p>
          <h2 class="t-h2 mt-2">Prohibited &amp; high-risk classification</h2>
          <div class="tmpl-assessment__q">
            <p class="t-body">Have you mapped each AI system to the Act's risk categories?</p>
            <!-- slider styling = Phase 3 -->
            <input type="range" min="0" max="10" value="4" aria-label="Risk classification readiness 0 to 10" style="width:100%;margin-top:12px;accent-color:var(--color-accent);" />
            <div class="tmpl-assessment__anchors">
              <span class="t-body-sm" style="color:var(--color-text-secondary)">0 — Not started</span>
              <span class="t-body-sm" style="color:var(--color-text-secondary)">10 — Audit-defensible</span>
            </div>
            <p class="mt-3"><span class="badge badge--risk">Critical gap</span></p>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
