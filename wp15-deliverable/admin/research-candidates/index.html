<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Candidates — theAIReadyist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0D1B2A;--surface:#0F2233;--raised:#122739;
      --teal:#00C9A7;--amber:#E8A838;--red:#e05c5c;
      --text:#F0F4F8;--text-sec:rgba(240,244,248,.65);--text-mut:rgba(240,244,248,.40);
      --border:rgba(0,201,167,.20);--border-hi:rgba(0,201,167,.55);--border-sub:rgba(255,255,255,.08);
      --head:'Playfair Display',Georgia,serif;--body:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono','Courier New',monospace;
    }
    html{font-size:16px}
    body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;min-height:100vh}
    .header{border-bottom:1px solid var(--border);padding:40px 44px 26px}
    .header-inner{max-width:1040px;margin:0 auto}
    .eyebrow{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--teal);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--border);padding:4px 10px;margin-bottom:16px}
    h1{font-family:var(--head);font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.12;margin-bottom:10px}
    h1 em{color:var(--teal);font-style:italic}
    .sub{font-size:14.5px;color:var(--text-sec);max-width:680px}
    .nav{margin-top:16px;display:flex;gap:22px;flex-wrap:wrap}
    .nav a{font-family:var(--mono);font-size:11.5px;color:var(--text);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:2px}
    .nav a:hover{color:var(--teal);border-color:var(--teal)}
    .main{max-width:1040px;margin:0 auto;padding:26px 44px 80px}
    .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mut)}
    .field select{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 10px;font-family:var(--body);font-size:14px;min-width:170px}
    .status{font-family:var(--mono);font-size:13px;min-height:20px;margin-bottom:18px;color:var(--amber)}
    .status.err{color:var(--red)} .status.ok{color:var(--teal)}
    .counter{font-family:var(--mono);font-size:12px;color:var(--text-mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
    .empty{border:1px dashed var(--border);padding:48px 28px;text-align:center;color:var(--text-mut)}
    .empty-icon{font-family:var(--head);font-size:40px;color:var(--border-hi);display:block;margin-bottom:12px}
    .rc{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--teal);margin-bottom:18px;padding:18px 22px}
    .rc[data-status="archived"]{opacity:.55;border-left-color:var(--text-mut)}
    .rc[data-status="completed"]{border-left-color:var(--teal)}
    .rc[data-status="research_started"]{border-left-color:var(--amber)}
    .rc-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--text-mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
    .rc-id{color:var(--teal)}
    .rc-pillar{color:var(--text-sec)}
    .rc-topic{font-family:var(--head);font-size:19px;font-weight:700;line-height:1.25;margin-bottom:8px}
    .rc-src{font-size:12.5px;color:var(--text-mut);margin-bottom:12px}
    .rc-src a{color:var(--text-sec)} .rc-src a:hover{color:var(--teal)}
    .rc-notes{width:100%;background:var(--raised);color:var(--text);border:1px solid var(--border-sub);padding:9px 11px;font-family:var(--body);font-size:13.5px;resize:vertical;margin-bottom:12px}
    .rc-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .rc-actions select{background:var(--raised);color:var(--text);border:1px solid var(--border-sub);padding:7px 9px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
    .btn{padding:8px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid;background:none}
    .btn-launch{color:var(--bg);background:var(--teal);border-color:var(--teal)} .btn-launch:hover{filter:brightness(1.1)}
    .btn-save{color:var(--text);border-color:var(--border-sub)} .btn-save:hover{border-color:var(--text-sec)}
    .gate-note{font-family:var(--mono);font-size:10.5px;color:var(--text-mut);margin-left:auto}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <span class="eyebrow">Research · Internal</span>
      <h1>Research <em>Candidates</em></h1>
      <p class="sub">A human-curated backlog of future research topics, captured from high-value Executive Signals. Selecting a candidate pre-fills the Research Agent — nothing launches automatically.</p>
      <div class="nav">
        <a href="/admin/signals/">Signal review</a>
        <a href="/admin/research-agent/">Research agent</a>
        <a href="/admin/observation/">Observation</a>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="filters">
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status">
          <option value="">All</option><option value="new">New</option><option value="reviewing">Reviewing</option>
          <option value="research_started">Research started</option><option value="completed">Completed</option><option value="archived">Archived</option>
        </select></div>
      <div class="field"><label for="f-pillar">Pillar</label>
        <select id="f-pillar">
          <option value="">All pillars</option>
          <option>Executive Operating Models</option><option>Decision Intelligence</option><option>Agentic Governance</option>
          <option>AI Economics</option><option>Human Agency</option><option>Sovereign AI</option>
        </select></div>
    </div>
    <div class="status" id="statusline"></div>
    <div class="counter" id="counter"></div>
    <div id="list"></div>
  </main>
<script>
(function(){
  var list=document.getElementById('list'),counter=document.getElementById('counter'),statusEl=document.getElementById('statusline');
  var STAT=['new','reviewing','research_started','completed','archived'];
  var LABEL={new:'New',reviewing:'Reviewing',research_started:'Research started',completed:'Completed',archived:'Archived'};
  function setStatus(m,k){statusEl.textContent=m||'';statusEl.className='status'+(k?' '+k:'');if(m)setTimeout(function(){if(statusEl.textContent===m){statusEl.textContent='';statusEl.className='status';}},5000);}
  function key(force){var k=!force&&localStorage.getItem('adminApiKey');if(!k){k=window.prompt('Enter admin key');if(k)localStorage.setItem('adminApiKey',k);}return k;}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function q(){var p=new URLSearchParams();var s=document.getElementById('f-status').value,pi=document.getElementById('f-pillar').value;if(s)p.set('status',s);if(pi)p.set('pillar',pi);return p.toString();}

  async function load(force){
    var k=key(force);if(!k){list.innerHTML=empty('Admin key required — reload to enter it.');return;}
    setStatus('Loading…');
    try{
      var res=await fetch('/api/research-candidates?'+q(),{headers:{'x-admin-key':k}});
      if(res.status===401){localStorage.removeItem('adminApiKey');list.innerHTML=empty('Admin key rejected.');if(!force)load(true);return;}
      if(!res.ok)throw new Error('HTTP '+res.status);
      var data=await res.json();setStatus('');render(data.candidates||[]);
    }catch(e){list.innerHTML=empty('Could not load candidates — is the API deployed?');}
  }
  function empty(t){return '<div class="empty"><span class="empty-icon">◎</span>'+esc(t)+'</div>';}

  function render(rows){
    counter.textContent=rows.length+' candidate'+(rows.length===1?'':'s');
    if(!rows.length){list.innerHTML=empty('No research candidates yet. Use “Publish + Research Candidate” in Signal review to add one.');return;}
    list.innerHTML=rows.map(card).join('');
  }
  function card(d){
    var date=d.created_at?new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
    var opts=STAT.map(function(s){return '<option value="'+s+'"'+(s===d.status?' selected':'')+'>'+LABEL[s]+'</option>';}).join('');
    var briefNote=d.research_brief_id?(' · brief '+esc(d.research_brief_id)):'';
    return ''
      +'<article class="rc" data-id="'+esc(d.id)+'" data-status="'+esc(d.status)+'">'
      +  '<div class="rc-meta"><span class="rc-id">'+esc(d.id)+'</span><span>'+esc(date)+'</span>'
      +    (d.pillar?'<span class="rc-pillar">'+esc(d.pillar)+'</span>':'')+'<span>'+esc(LABEL[d.status]||d.status)+briefNote+'</span></div>'
      +  '<div class="rc-topic">'+esc(d.candidate_topic||'')+'</div>'
      +  '<div class="rc-src">from: “'+esc(d.signal_title||'—')+'”'+(d.signal_url?' · <a href="'+esc(d.signal_url)+'" target="_blank" rel="noopener noreferrer">source ↗</a>':'')+'</div>'
      +  '<textarea class="rc-notes" data-f="editorial_notes" rows="2" placeholder="Editorial notes / rationale…">'+esc(d.editorial_notes||'')+'</textarea>'
      +  '<div class="rc-actions">'
      +    '<button type="button" class="btn btn-launch" onclick="window._launch(this)">Launch in Research Agent →</button>'
      +    '<button type="button" class="btn btn-save" onclick="window._save(this)">Save notes</button>'
      +    '<select data-f="status" onchange="window._status(this)">'+opts+'</select>'
      +    '<span class="gate-note">Selecting a candidate pre-fills the agent — you still launch manually</span>'
      +  '</div>'
      +'</article>';
  }
  function cardOf(el){return el.closest('.rc');}
  async function patch(id,body){
    var k=key();if(!k)return null;
    var res=await fetch('/api/research-candidates',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':k},body:JSON.stringify(Object.assign({id:id},body))});
    return res;
  }
  window._save=async function(btn){var c=cardOf(btn),id=c.getAttribute('data-id');var notes=c.querySelector('[data-f="editorial_notes"]').value;
    btn.disabled=true;var r=await patch(id,{editorial_notes:notes});btn.disabled=false;setStatus(r&&r.ok?id+' notes saved.':'Save failed.',r&&r.ok?'ok':'err');};
  window._status=async function(sel){var c=cardOf(sel),id=c.getAttribute('data-id');var st=sel.value;
    var r=await patch(id,{status:st});if(r&&r.ok){c.setAttribute('data-status',st);setStatus(id+' → '+st,'ok');}else setStatus('Status update failed.','err');};
  window._launch=async function(btn){
    var c=cardOf(btn),id=c.getAttribute('data-id');
    var topic=c.querySelector('.rc-topic').textContent.trim();
    var notes=c.querySelector('[data-f="editorial_notes"]').value;
    var src=c.querySelector('.rc-src a');var signalUrl=src?src.href:'';
    var signalTitle=(c.querySelector('.rc-src').textContent.match(/from:\s*“([^”]*)”/)||[])[1]||'';
    btn.disabled=true;
    await patch(id,{status:'research_started'});  // mark before handing off
    var p=new URLSearchParams({topic:topic,candidate:id});
    if(notes)p.set('rationale',notes);
    if(signalTitle)p.set('signal',signalTitle);
    if(signalUrl)p.set('signal_url',signalUrl);
    window.location.href='/admin/research-agent/?'+p.toString();
  };

  document.getElementById('f-status').addEventListener('change',function(){load();});
  document.getElementById('f-pillar').addEventListener('change',function(){load();});
  load();
})();
</script>
</body>
</html>
